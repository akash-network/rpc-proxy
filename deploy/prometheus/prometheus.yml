global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write: []

scrape_configs:
  - job_name: 'rpc-proxy'
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          service: 'rpc-proxy'

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
