name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: [self-hosted, akash]
    env:
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go build -v ./...
      - run: go test -v -cover -timeout=30s ./...
